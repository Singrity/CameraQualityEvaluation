services:

  redis:
    image: redis:7-alpine
    container_name: camera_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      REDIS_HOST: redis
    depends_on:
      - redis


volumes:
  redis_data:
